# Configuração do workspace pnpm.
#
# IMPORTANTE (pnpm 11): a chave antiga `onlyBuiltDependencies` é IGNORADA.
# A forma correta agora é o mapa `allowBuilds` — foi o que o próprio
# `pnpm approve-builds` gravou. Sem isto, o `pnpm install` termina com
# [ERR_PNPM_IGNORED_BUILDS] e a Netlify aborta na etapa "Install dependencies".
#
# `sharp` é usado pelo next/image para otimizar imagens. Servimos os PNGs já
# otimizados (images.unoptimized: true), mas o install falha se o script for
# ignorado — por isso autorizamos explicitamente.
allowBuilds:
  sharp: true

# Não revalida dependências antes de cada script, evitando o bloqueio
# do install em ambientes de CI.
verifyDepsBeforeRun: false
