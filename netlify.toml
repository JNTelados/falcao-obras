# Configuracao de publicacao automatica na Netlify.
# Cada push no repositorio gera e publica o site sozinho - sem arrastar pastas.
# (Texto apenas em ASCII para evitar problemas de codificacao.)

[build]
  command = "pnpm build:static"
  publish = "out"

[build.environment]
  NODE_VERSION = "22"
  # pnpm e ativado via corepack (evita falha de "pnpm: command not found")
  NETLIFY_USE_PNPM = "true"
  # Dominio proprio (canonical, Open Graph, sitemap)
  NEXT_PUBLIC_SITE_URL = "https://falcaoobras.pt"

# ---------------------------------------------------------------------
#  IMPORTANTE - COMO EVITAR CICLO DE REDIRECIONAMENTOS
#
#  1. NAO adicionar aqui nenhuma regra de redirect entre falcaoobras.pt e
#     www.falcaoobras.pt. A Netlify ja trata disso sozinha.
#
#  2. No painel da Netlify, em Domain management, deixe APENAS UM dominio:
#        falcaoobras.pt          <- recomendado (mais curto)
#     Remova o "www.falcaoobras.pt" da lista.
#
#  Se os dois ficarem na lista com configuracoes opostas, um manda para o
#  outro e o site entra em ciclo infinito (nao abre em nenhum navegador).
# ---------------------------------------------------------------------

# Ficheiros do Next.js tem hash no nome: podem ser cacheados para sempre.
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Imagens e icones da marca mudam pouco: cache longa.
[[headers]]
  for = "/brand/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/og-image.png"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Cabecalhos de seguranca no site publicado.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
