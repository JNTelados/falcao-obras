# Configuracao de publicacao automatica na Netlify.
# Cada push no repositorio gera e publica o site sozinho - sem arrastar pastas.
# (Texto apenas em ASCII para evitar problemas de codificacao.)

[build]
  command = "pnpm build:static"
  publish = "out"

[build.environment]
  NODE_VERSION = "22"
  # pnpm e ativado via corepack (evita falha de "pnpm: command not found")
  NETLIFY_USE_PNPM = "true"
  # Dominio proprio (canonical, Open Graph, sitemap)
  NEXT_PUBLIC_SITE_URL = "https://www.falcaoobras.pt"

# ---------------------------------------------------------------------
#  ATENCAO: nao criar aqui uma regra de redirect para o www.
#
#  A Netlify ja redireciona automaticamente todos os dominios secundarios
#  para o dominio principal definido no painel
#  (Domain management -> ... -> Set as primary).
#
#  Se adicionarmos uma regra nossa apontando para o lado oposto, o
#  resultado e um CICLO infinito de redirecionamentos e o site nao abre.
#
#  Para o endereco canonico ser o www, defina
#  "www.falcaoobras.pt" como PRIMARY DOMAIN no painel da Netlify.
# ---------------------------------------------------------------------

# Ficheiros do Next.js tem hash no nome: podem ser cacheados para sempre.
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Imagens e icones da marca mudam pouco: cache longa.
[[headers]]
  for = "/brand/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/og-image.png"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Cabecalhos de seguranca no site publicado.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
