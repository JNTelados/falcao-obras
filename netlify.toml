# Configuração de publicação automática na Netlify.
# Cada push no repositório gera e publica o site sozinho — sem arrastar pastas.

[build]
  command = "pnpm build:static"
  publish = "out"

[build.environment]
  NODE_VERSION = "22"
  # pnpm é ativado via corepack (evita falha de "pnpm: command not found")
  NETLIFY_USE_PNPM = "true"
  # Domínio próprio (canonical, Open Graph, sitemap)
  NEXT_PUBLIC_SITE_URL = "https://www.falcaoobras.pt"

# NOTA IMPORTANTE sobre o redirecionamento www:
# NÃO criar aqui uma regra de redirect para o www. A Netlify já redireciona
# automaticamente todos os domínios secundários para o domínio principal
# definido no painel (Domain management -> Set as primary). Se juntarmos uma
# regra nossa apontando para o lado oposto, o resultado é um CICLO infinito
# de redirecionamentos (o site deixa de abrir).
#
# Para o endereço canónico ser o www, basta definir
# "www.falcaoobras.pt" como PRIMARY DOMAIN no painel da Netlify.

# Cabeçalhos: os ficheiros do Next.js têm hash no nome, cache para sempre.
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Imagens e ícones da marca mudam pouco: cache longa.
[[headers]]
  for = "/brand/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/og-image.png"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Cabeçalhos de segurança no site publicado.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
