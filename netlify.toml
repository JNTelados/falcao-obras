# Configuração de publicação automática na Netlify.
# Cada push no repositório gera e publica o site sozinho — sem arrastar pastas.

[build]
  command = "pnpm build:static"
  publish = "out"

[build.environment]
  NODE_VERSION = "22"
  # pnpm é ativado via corepack (evita falha de "pnpm: command not found")
  NETLIFY_USE_PNPM = "true"
  # Domínio próprio (canonical, Open Graph, sitemap)
  NEXT_PUBLIC_SITE_URL = "https://www.falcaoobras.pt"

# Endereço canónico é o www: quem digitar sem www é encaminhado para lá
# (evita conteúdo duplicado na indexação do Google).
[[redirects]]
  from = "https://falcaoobras.pt/*"
  to = "https://www.falcaoobras.pt/:splat"
  status = 301
  force = true

# Os ficheiros do Next.js têm hash no nome: podem ser cacheados para sempre.
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Imagens e ícones da marca mudam pouco: cache longa.
[[headers]]
  for = "/brand/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/og-image.png"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Cabeçalhos de segurança no site publicado.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
