# Configuração de publicação automática na Netlify.
# Cada push no repositório gera e publica o site sozinho — sem arrastar pastas.

[build]
  command = "pnpm build:static"
  publish = "out"

[build.environment]
  NODE_VERSION = "22"
  # pnpm é ativado via corepack (evita falha de "pnpm: command not found")
  NETLIFY_USE_PNPM = "true"
  # Troque aqui quando tiver um domínio próprio (ex.: https://www.falcaoobras.pt)
  NEXT_PUBLIC_SITE_URL = "https://falcao.netlify.app"

# Os ficheiros do Next.js têm hash no nome: podem ser cacheados para sempre.
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Imagens e ícones da marca mudam pouco: cache longa.
[[headers]]
  for = "/brand/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/og-image.png"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Cabeçalhos de segurança no site publicado.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
